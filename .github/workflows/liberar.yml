name: Liberar e-mails

# Libera (ou remove) o acesso de pessoas ao app no Cloudflare Access.
# Pode ser disparado pelo Claude ou à mão: Actions > Liberar e-mails > Run workflow.
on:
  workflow_dispatch:
    inputs:
      emails:
        description: 'E-mails separados por vírgula'
        required: true
        type: string
      acao:
        description: 'liberar ou remover'
        required: true
        default: liberar
        type: choice
        options: [liberar, remover]

jobs:
  liberar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Atualizar a lista de convidados
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 28653809fc1af49b5c9a587a86992a09
          EMAILS: ${{ inputs.emails }}
          ACAO: ${{ inputs.acao }}
        run: node scripts/liberar.mjs
