name: App Android

# Gera o APK do app Android de graça, a cada envio de código.
# O arquivo fica para baixar na aba "Actions" do GitHub (seção Artifacts).
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências
        run: npm ci
      - name: Testes do app web
        run: npm test
      - name: Gerar o app web
        run: npm run build
      - name: Copiar para o Android
        run: npx cap sync android
      - name: Testes do leitor nativo e APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: meus-planos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
